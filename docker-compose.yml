services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart-retail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartretail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail_password
    ports:
      - "5432:5432"
    volumes:
      - smart_retail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d smartretail"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smart_retail_pgdata:
